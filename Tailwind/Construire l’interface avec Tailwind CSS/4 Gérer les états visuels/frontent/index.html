
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des Catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800">

    <!-- Container des Toasts -->
    <div id="toast-container"
        class="fixed top-4 right-4 z-50 w-[calc(100%-2rem)] max-w-sm">
    </div>

    <main class="w-full max-w-6xl mx-auto px-4 py-6 sm:px-6 md:px-10 md:py-10">

        <!-- En-tête -->
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">

            <div>
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">
                    Gestion des Catégories
                </h2>

                <p class="text-sm sm:text-base text-gray-500 mt-2">
                    Gérer les catégories des articles de mode
                </p>
            </div>

            <button
                type="button"
                id="btn-ajouter"
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700
                text-white font-medium px-5 py-3 rounded-lg shadow-sm
                transition duration-200 ease-in-out
                focus-visible:outline-none focus-visible:ring-2
                focus-visible:ring-blue-500 focus-visible:ring-offset-2">

                + Nouvelle catégorie
            </button>

        </div>

        <!-- Formulaire -->
        <div
            id="div_form"
            class="hidden p-4 sm:p-6 bg-white mb-8 rounded-xl
            shadow-sm border border-gray-200">

            <h3 class="text-lg sm:text-xl font-bold mb-6 text-gray-900">
                Ajouter une catégorie
            </h3>

            <form id="form-categorie" class="space-y-4">

                <div>
                    <label for="nom"
                        class="block mb-2 font-medium text-gray-700">
                        Nom de la catégorie
                    </label>

                    <input
                        type="text"
                        name="nom"
                        id="nom"
                        placeholder="Ex : Robes"
                        required
                        class="w-full min-w-0 border border-gray-300 p-3
                        rounded-lg transition duration-200
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="description"
                        class="block mb-2 font-medium text-gray-700">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Description de la catégorie"
                        rows="4"
                        class="w-full min-w-0 border border-gray-300 p-3
                        rounded-lg resize-y transition duration-200
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 focus:border-blue-500">
                    </textarea>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">

                    <!-- Bouton Enregistrer + Spinner -->
                    <button
                        id="btn-submit"
                        type="submit"
                        class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700
                        text-white font-medium px-5 py-3 sm:py-2.5
                        rounded-lg transition duration-200 ease-in-out
                        disabled:opacity-75 disabled:cursor-not-allowed
                        focus-visible:outline-none focus-visible:ring-2
                        focus-visible:ring-blue-500 focus-visible:ring-offset-2">

                        <svg
                            id="spinner"
                            class="hidden w-4 h-4 animate-spin inline-block mr-2"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4">
                            </circle>

                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                            </path>

                        </svg>

                        <span id="btn-text">Enregistrer</span>

                    </button>

                    <!-- Bouton Annuler -->
                    <button
                        type="button"
                        id="btn-annuler"
                        class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300
                        text-gray-700 font-medium px-5 py-3 sm:py-2.5
                        rounded-lg transition duration-200 ease-in-out
                        focus-visible:outline-none focus-visible:ring-2
                        focus-visible:ring-gray-400 focus-visible:ring-offset-2">

                        Annuler
                    </button>

                </div>

            </form>
        </div>

        <!-- Tableau -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

            <div class="p-4 sm:p-5 border-b border-gray-200">
                <h3 class="text-lg font-bold text-gray-900">
                    Liste des catégories
                </h3>

                <p class="text-sm text-gray-500 mt-1">
                    Retrouvez toutes les catégories enregistrées.
                </p>
            </div>

            <!-- Scroll horizontal sur mobile -->
            <div class="w-full overflow-x-auto">

                <table class="w-full min-w-[500px] text-left">

                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="p-3 sm:p-4 text-xs sm:text-sm
                            font-semibold uppercase tracking-wide">
                                Nom
                            </th>

                            <th class="p-3 sm:p-4 text-xs sm:text-sm
                            font-semibold uppercase tracking-wide">
                                Description
                            </th>
                        </tr>
                    </thead>

                    <tbody
                        id="tbody"
                        class="divide-y divide-gray-100">

                        <!-- Catégories ajoutées avec JavaScript -->

                    </tbody>

                </table>
            </div>
        </div>

        <!-- Pied de page -->
        <footer class="text-center text-xs sm:text-sm text-gray-400 mt-8">
            Gestion des catégories — Blog Spartel
        </footer>

    </main>

    <script src="app.js"></script>

</body>
</html>
